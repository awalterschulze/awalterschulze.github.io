<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>awalterschulze</title>
  <link rel="shortcut icon" href="favicon.ico" />

  <style>

    .wrapper {
      display: grid;
      grid-template-columns: auto;
      grid-gap: 10px;
      justify-content: center;
    }

    .box {
      border-radius: 0px;
      padding: 0px;
      font-size: 36px;
      align-items: center;
      vertical-align: top;
    }
    
    img {
      vertical-align: top;
    }

    h1 {
      text-align:center;
    }

  </style>

</head>

<body>
  <h1>a Walter Schulze</h1>

  <div class="wrapper">

      <div class="box">
        <img alt="disk" src="./images/hard-disk-svgrepo-com.svg" width="48" height="48"/>
        <a href="https://code.awalterschulze.org">code</a>
      </div>

      <div class="box">
        <img alt="pen" src="./images/pen-svgrepo-com.svg" width="48" height="48"/>
        <a href="https://blog.awalterschulze.org">blog</a>
      </div>

      <div class="box">
        <img alt="mic" src="./images/recording-svgrepo-com.svg" width="48" height="48"/>
        <a href="https://talks.awalterschulze.org">talks</a>
      </div>

      <div class="box">
        <img alt="music note" src="./images/music-note-svgrepo-com.svg" width="48" height="48"/>
        <a href="https://music.awalterschulze.org">music</a>
      </div>

      <div class="box">
        <img alt="tv" src="./images/tv-svgrepo-com.svg" width="48" height="48"/>
        <a href="https://videos.awalterschulze.org">videos</a>
      </div>

      <div class="box">
        <img alt="head and pen" src="./images/color-blocks-write-contacts-svgrepo-com.svg" width="48" height="48"/>
        <a href="https://cv.awalterschulze.org">cv</a>
      </div>

      <div class="box">
        <img alt="contact book" src="./images/phonebook-svgrepo-com.svg" width="48" height="48"/>
        <a href="https://contact.awalterschulze.org">contact</a>
      </div>

  </div>
  

</body>

</html>
